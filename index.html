<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OneOne Cleaner</title>
    <style>
      /* 内联关键 CSS,JS 加载前即可渲染,避免白屏 */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eaf2ff 0%, #ffffff 60%);
        color: #2b7fff;
        z-index: 9999;
        transition: opacity 0.32s ease;
      }
      #app-loading.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-loading .ring {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2b7fff 0%, #4dabff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        box-shadow: 0 8px 24px rgba(43, 127, 255, 0.28);
        animation: floaty 2.4s ease-in-out infinite;
      }
      #app-loading .ring svg { width: 32px; height: 32px; }
      #app-loading .title {
        font-size: 18px;
        font-weight: 600;
        color: #1d2129;
        margin-bottom: 4px;
        letter-spacing: 0.3px;
      }
      #app-loading .sub {
        font-size: 12px;
        color: #86909c;
        margin-bottom: 24px;
      }
      #app-loading .spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(43, 127, 255, 0.18);
        border-top-color: #2b7fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      /* 深色模式 */
      @media (prefers-color-scheme: dark) {
        html, body { background: #0f1115; }
        #app-loading {
          background: linear-gradient(135deg, #1a2a44 0%, #0f1115 60%);
        }
        #app-loading .title { color: #e5e6eb; }
        #app-loading .sub { color: #86909c; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      加载占位:在 Vue 挂载前显示
      防止用户看到白屏,几秒后 Vue 挂载完毕由 main.ts 隐藏
    -->
    <div id="app-loading">
      <div class="ring">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 3h-4l-2 2v14l2 2h4l2-2V5l-2-2z" fill="white" opacity="0.95"/>
          <path d="M11 8h2v6h-2zM11 16h2v2h-2z" fill="#2b7fff"/>
        </svg>
      </div>
      <div class="title">OneOne Cleaner</div>
      <div class="sub">让 Windows 重回轻盈</div>
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
